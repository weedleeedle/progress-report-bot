services:
    app:
        build: .
        env_file:
            - .env
        depends_on: 
            db:
                condition: service_healthy
                restart: true
    db:
        image: postgres:17
        env_file: 
            - .env
        volumes:
            - db-data:/var/lib/postgres/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s

volumes:
    db-data:
